<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">SimpleSyntheticFlightPaths.jl</title>
  <desc id="desc">Three Julia-colored sample points lying on a wiggly UAV flight path.</desc>

  <!-- Flight path: a smooth S-curve drawn as a dotted trail -->
  <path d="M 64 400 C 64 220, 448 300, 448 112"
        fill="none" stroke="#7C8794" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="1 24"/>

  <!-- Samples lying exactly on the path (Julia's red, green, purple) -->
  <circle cx="104" cy="319" r="38" fill="#389826" stroke="#1F6B12" stroke-width="12"/>
  <circle cx="256" cy="259" r="38" fill="#CB3C33" stroke="#9B2D26" stroke-width="12"/>
  <circle cx="408" cy="197" r="38" fill="#9558B2" stroke="#6B3A85" stroke-width="12"/>
</svg>
